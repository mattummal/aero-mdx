[package]
name = "aero-mdx"
version = "0.1.0"
edition = "2021"

[dependencies]
# Concurrency & IPC
tokio = { version = "1.36", features = ["full"] }
rtrb = "0.3"
core_affinity = "0.8"

# Parsing & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Network
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
